<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2370"/>
      <stop offset=".55" stop-color="#4a3fb5"/>
      <stop offset="1" stop-color="#3d6be0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".15" r=".8">
      <stop offset="0" stop-color="#b9acff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b9acff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e0fb"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0668a"/>
      <stop offset="1" stop-color="#b93a63"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3590"/>
      <stop offset="1" stop-color="#15133d"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b0a30" flood-opacity=".55"/>
    </filter>
    <path id="heart" d="M0 44 C-62 2 -54 -48 -24 -48 C-9 -48 0 -37 0 -27 C0 -37 9 -48 24 -48 C54 -48 62 2 0 44Z"/>
    <path id="spade" d="M0 -50 C-12 -30 -56 -16 -56 14 C-56 34 -32 40 -17 28 C-19 42 -24 50 -32 56 L32 56 C24 50 19 42 17 28 C32 40 56 34 56 14 C56 -16 12 -30 0 -50Z"/>
    <path id="star" d="M0 -22 C2 -8 8 -2 22 0 C8 2 2 8 0 22 C-2 8 -8 2 -22 0 C-8 -2 -2 -8 0 -22Z"/>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="3"/>

  <!-- звёздочки -->
  <use href="#star" transform="translate(96 108) scale(.9)" fill="#d6ceff" opacity=".9"/>
  <use href="#star" transform="translate(425 150) scale(.6)" fill="#bcd0ff" opacity=".85"/>
  <use href="#star" transform="translate(402 428) scale(.75)" fill="#d6ceff" opacity=".7"/>
  <use href="#star" transform="translate(84 400) scale(.45)" fill="#bcd0ff" opacity=".7"/>

  <!-- задняя карта: червы -->
  <g transform="translate(212 268) rotate(-14)" filter="url(#sh)">
    <rect x="-100" y="-142" width="200" height="284" rx="28" fill="url(#paper)"/>
    <rect x="-100" y="-142" width="200" height="284" rx="28" fill="none" stroke="#8b7cf6" stroke-opacity=".35" stroke-width="2"/>
    <use href="#heart" transform="translate(0 4) scale(1.5)" fill="url(#rose)"/>
    <use href="#heart" transform="translate(-68 -104) scale(.34)" fill="url(#rose)"/>
  </g>

  <!-- передняя карта: пики -->
  <g transform="translate(300 252) rotate(11)" filter="url(#sh)">
    <rect x="-100" y="-142" width="200" height="284" rx="28" fill="url(#paper)"/>
    <rect x="-100" y="-142" width="200" height="284" rx="28" fill="none" stroke="#8b7cf6" stroke-opacity=".35" stroke-width="2"/>
    <use href="#spade" transform="translate(0 0) scale(1.45)" fill="url(#ink)"/>
    <use href="#spade" transform="translate(-68 -104) scale(.34)" fill="url(#ink)"/>
  </g>
</svg>
